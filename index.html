<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Scoreboard</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e2e5e9;
    --hover: #f3f4f6;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --surface: #ffffff;
    --danger: #dc2626;
    --warn: #b45309;
    --overlay: rgba(17, 20, 26, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --ink: #e8eaed;
      --muted: #9aa0a6;
      --line: #32363c;
      --hover: #22262c;
      --accent: #6ea8fe;
      --accent-ink: #10151c;
      --surface: #1e2229;
      --danger: #f87171;
      --warn: #fbbf24;
      --overlay: rgba(0, 0, 0, .62);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 20px 12px 40px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }

  /* Scoped: a bare `form` rule also caught the dialog's form and laid its
     sections out in a row. */
  #add-form { display: flex; gap: 8px; margin-bottom: 16px; }
  input, button { font: inherit; }
  /* 16px keeps iOS from zooming the page when a field takes focus. */
  #team-name, td input { font-size: 16px; }
  #team-name {
    flex: 1 1 auto; min-width: 0; padding: 8px 10px; min-height: 44px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  button {
    padding: 8px 14px; min-height: 44px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--hover); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }

  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: right; }
  th:nth-child(2), td.name { text-align: left; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--ink); }
  th[aria-sort]::after { content: " \25B2"; font-size: 9px; }
  th[aria-sort="descending"]::after { content: " \25BC"; }

  td.seq { color: var(--muted); width: 1%; font-variant-numeric: tabular-nums; }
  /* Total and rank are one line: without this the column wraps to two rows. */
  td.total { width: 1%; white-space: nowrap; }
  .total-position {
    display: inline-flex;
    width: 100%;
    justify-content: space-between;
  }
  .rank { margin-left: 4px; font-size: 14px; font-weight: 500; }
  .rank-indicator { font-size: 9px; color: var(--muted); }
  tr.first td.total, tr.first td.name { font-weight: 700; color: var(--ink); }
  tr.first .rank { color: var(--ink); }
  td.name { cursor: text; }
  td.score { cursor: pointer; width: 54px; }
  td.score:hover, td.name:hover { background: var(--hover); }
  td.score:focus-visible, td.name:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.empty-score { color: var(--muted); }
  td.total { font-weight: 600; }
  td.edit { width: 1%; padding: 0 0 0 4px; }
  td.edit button {
    padding: 4px 8px; min-height: 30px; font-size: 12px;
    color: var(--muted); background: none; border-color: transparent;
  }
  td.edit button:hover { color: var(--ink); border-color: var(--line); }

  td input {
    width: 100%; padding: 2px 4px; text-align: right;
    border: 1px solid var(--accent); border-radius: 3px;
    background: var(--bg); color: var(--ink);
  }
  td.name input { text-align: left; }
  /* Spinner arrows waste the little width a score cell has. */
  td input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  td input::-webkit-outer-spin-button,
  td input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .pl-short { display: none; }

  #hint { color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Notifications ---------------------------------------------------------- */
  .notifications {
    position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%); bottom: 16px;
    width: min(440px, calc(100vw - 24px));
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;            /* only the notes themselves take clicks */
  }
  .note {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 14px;
    border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .18);
    font-size: 14px;
  }
  .note-warn { border-left-color: var(--warn); }
  .note-text { flex: 1; min-width: 0; }
  .note-action { padding: 5px 10px; min-height: 0; font-size: 13px; white-space: nowrap; }
  .note-close {
    padding: 0; width: 28px; min-height: 28px; flex: none;
    border-color: transparent; background: none; color: var(--muted);
    font-size: 17px; line-height: 1;
  }
  .note-close:hover { color: var(--ink); border-color: var(--line); }

  /* Edit dialog ------------------------------------------------------------ */
  .backdrop {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--overlay);
  }
  .modal {
    width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 18px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .32);
  }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  /* The title takes the room that is left and cuts the name, rather than
     pushing Delete off the edge. min-width:0 is what lets a flex item shrink
     below its content. */
  .modal:focus { outline: none; }
  .modal h2 {
    margin: 0; font-size: 17px; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #edit-delete { flex: none; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  }
  .field input {
    padding: 8px 10px; min-height: 44px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  #edit-rounds {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  #edit-rounds .field input { text-align: center; padding: 8px 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .danger { color: var(--danger); }
  .danger:hover { border-color: var(--danger); }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .primary:hover { border-color: var(--accent); filter: brightness(1.08); }

  @media (max-width: 620px) {
    body { padding: 16px 12px 40px; }
    th, td { padding: 4px 4px; }
    /* ~44px rows so a score cell is a comfortable tap target. */
    td.score { width: 40px; height: 44px; padding: 0; text-align: center; }
    /* No columns are pinned: the whole table fits from ~320px up with typical
       scores (~330px if every round is a 10), so there is no hand-kept offset
       to match a rendered width. Narrower than that, .wrap scrolls sideways. */
    th:first-child, td.seq {
      /* width on a table cell cannot beat min-content, so shrink the content. */
      font-size: 12px; padding-left: 2px; padding-right: 2px;
    }
    th:nth-child(2), td.name {
      max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    td.name input { max-width: 100%; }
    .rp, .pl-full { display: none; }
    .pl-short { display: inline; }
    td input { text-align: center; padding: 2px 0; }
    /* Keep the whole table inside a 360px screen: no sideways scroll. */
    td.edit { padding: 0; }
    td.edit button { padding: 4px 5px; min-height: 32px; font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <h1>Quiz Scoreboard</h1>

  <form id="add-form">
    <input id="team-name" placeholder="Team name" autocomplete="off" maxlength="40">
    <button type="submit">Add team</button>
  </form>

  <div class="wrap">
    <table id="board">
      <thead>
        <tr>
          <th data-sort="seq" title="Order teams were added">#</th>
          <th data-sort="name" title="Sort by name">Team</th>
          <th data-sort="r0"><span class="rp">R</span>1</th>
          <th data-sort="r1"><span class="rp">R</span>2</th>
          <th data-sort="r2"><span class="rp">R</span>3</th>
          <th data-sort="r3"><span class="rp">R</span>4</th>
          <th data-sort="r4"><span class="rp">R</span>5</th>
          <th data-sort="total" title="Sort by total, which is also the order of places"><span class="pl-full">Total</span><span class="pl-short">Tot</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p id="hint">Tap a round cell to enter points (0&ndash;10, halves allowed) &mdash; Enter moves to the next one. Tap a team name to rename it, a column header to sort, or Edit to change a whole team at once.</p>
</main>

<div id="notifications" class="notifications" role="status" aria-live="polite"></div>

<div id="modal-backdrop" class="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal-head">
      <h2 id="modal-title">Edit team</h2>
      <button type="button" id="edit-delete" class="danger">Delete team</button>
    </div>
    <!-- novalidate: out-of-range values are clamped by parseScore, the same way
         the inline editor treats them, instead of blocking the save. -->
    <form id="edit-form" novalidate>
      <label class="field" for="edit-name"><span>Team name</span>
        <input id="edit-name" type="text" maxlength="40" autocomplete="off">
      </label>
      <div id="edit-rounds"></div>
      <div class="modal-actions">
        <button type="submit" id="edit-done" class="primary">Done</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var KEY = 'quiz-scoreboard';
  var ROUNDS = 5;

  var teams = load();
  // Highest total first, which is the same thing as first place first.
  var sort = { key: 'total', dir: -1 };
  var editing = null;      // { id: teamId, field: 'name' | roundIndex }
  var activeInput = null;

  var tbody = document.querySelector('#board tbody');
  var notifications = document.getElementById('notifications');
  var backdrop = document.getElementById('modal-backdrop');
  var modalBox = backdrop.querySelector('.modal');
  var modalTitle = document.getElementById('modal-title');
  var nameField = document.getElementById('edit-name');
  var modalTeamId = null;
  var modalSnapshot = null;
  var returnFocusTo = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return [];
      return JSON.parse(raw).map(function (t, i) {
        var scores = Array.isArray(t.scores) ? t.scores.slice(0, ROUNDS) : [];
        while (scores.length < ROUNDS) scores.push(null);
        // Boards saved before the # column existed get numbered by stored order.
        return { id: t.id, seq: isFinite(t.seq) ? t.seq : i + 1, name: String(t.name), scores: scores };
      });
    } catch (e) {
      return [];
    }
  }

  // Never reused, so a team keeps its number when an earlier team is removed.
  function nextSeq() {
    return teams.reduce(function (m, t) { return Math.max(m, t.seq); }, 0) + 1;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(teams)); } catch (e) {}
  }

  function ordinalSuffix(n) {
    var suffix = ['th', 'st', 'nd', 'rd'];
    var v = n % 100;
    return (suffix[(v - 20) % 10] || suffix[v] || suffix[0]);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Totals, places (ties share a place), then the chosen sort order.
  function rows() {
    var list = teams.map(function (t) {
      var total = t.scores.reduce(function (a, v) { return a + (v || 0); }, 0);
      return { id: t.id, seq: t.seq, name: t.name, scores: t.scores, total: total, place: 0 };
    });

    var byTotal = list.slice().sort(function (a, b) { return b.total - a.total; });
    byTotal.forEach(function (t, i) {
      t.place = (i > 0 && byTotal[i - 1].total === t.total) ? byTotal[i - 1].place : i + 1;
    });

    var key = sort.key;
    list.sort(function (a, b) {
      var v;
      if (key === 'seq') v = a.seq - b.seq;
      else if (key === 'name') v = a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      else if (key === 'total') v = a.total - b.total;
      else {
        var i = +key.slice(1);
        v = (a.scores[i] == null ? -1 : a.scores[i]) - (b.scores[i] == null ? -1 : b.scores[i]);
      }
      return (v * sort.dir) || (a.place - b.place) || a.name.localeCompare(b.name);
    });
    return list;
  }

  function render() {
    if (activeInput) { activeInput.onblur = null; activeInput = null; }

    var list = rows();

    tbody.innerHTML = list.map(function (t) {
      var cells = t.scores.map(function (s, i) {
        if (editing && editing.id === t.id && editing.field === i) {
          return '<td class="score"><input type="number" min="0" max="10" step="0.5" ' +
                 'inputmode="decimal" enterkeyhint="next" value="' + (s == null ? '' : s) + '"></td>';
        }
        return '<td class="score' + (s == null ? ' empty-score' : '') + '" tabindex="0" ' +
               'data-field="' + i + '">' + (s == null ? '&ndash;' : s) + '</td>';
      }).join('');

      var name = (editing && editing.id === t.id && editing.field === 'name')
        ? '<td class="name"><input type="text" maxlength="40" enterkeyhint="done" value="' + esc(t.name) + '"></td>'
        : '<td class="name" tabindex="0" data-field="name" title="' + esc(t.name) + '">' + esc(t.name) + '</td>';

      return '<tr data-id="' + t.id + '"' + (t.place === 1 ? ' class="first"' : '') + '>' +
        '<td class="seq">' + t.seq + '</td>' +
        name + cells +
        '<td class="total">' +
          '<span class="total-position">' +
            t.total +
            '<span>' +
            ' <span class="rank">' + t.place + '</span><span class="rank-indicator">' + ordinalSuffix(t.place) + '</span>' +
            '</span>' +
            '</span>' +
        '</td>' +
        '<td class="edit"><button type="button" aria-label="Edit ' + esc(t.name) + '">✎</button></td>' +
      '</tr>';
    }).join('');

    if (!teams.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:left;color:var(--muted)">' +
                        'No teams yet &mdash; add one above.</td></tr>';
    }

    document.querySelectorAll('th[data-sort]').forEach(function (th) {
      if (th.dataset.sort === sort.key) {
        th.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending');
      } else {
        th.removeAttribute('aria-sort');
      }
    });

    var input = tbody.querySelector('input');
    if (input) {
      activeInput = input;
      input.focus();
      input.select();
      input.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      input.onblur = function () { commit(input.value); };
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(input.value, 1); }
        else if (e.key === 'Escape') { e.preventDefault(); editing = null; render(); }
        else if (e.key === 'Tab') { e.preventDefault(); commit(input.value, e.shiftKey ? -1 : 1); }
      };
    }
  }

  // Write an editor's value back to the model, without re-rendering.
  // Blank clears the score; anything else lands on 0-10, nearest half point.
  function parseScore(value) {
    var raw = String(value).trim();
    var n = Number(raw);
    if (raw === '' || !isFinite(n)) return null;
    return Math.max(0, Math.min(10, Math.round(n * 2) / 2));
  }

  function byId(id) {
    return teams.filter(function (t) { return t.id === id; })[0];
  }

  function applyEdit(target, value) {
    var team = byId(target.id);
    if (!team) return;

    if (target.field === 'name') {
      var name = value.trim();
      if (name) team.name = name;
    } else {
      team.scores[target.field] = parseScore(value);
    }
    save();
  }

  // Save whatever editor is open, so switching away never drops a keystroke.
  function flushOpenEditor() {
    if (editing && activeInput) applyEdit(editing, activeInput.value);
  }

  function commit(value, step) {
    if (!editing) return;
    var target = editing;
    applyEdit(target, value);
    editing = step ? nextCell(target, step) : null;
    render();
  }

  // Notifications ----------------------------------------------------------
  // notify(message, { action: { label, onClick }, tone: 'warn', timeout: ms })
  // timeout 0 keeps it up until the close button is used.
  function notify(message, opts) {
    opts = opts || {};

    var note = document.createElement('div');
    note.className = 'note' + (opts.tone ? ' note-' + opts.tone : '');

    var text = document.createElement('span');
    text.className = 'note-text';
    text.textContent = message;
    note.appendChild(text);

    var timer;
    function dismiss() {
      clearTimeout(timer);
      if (note.parentNode) note.parentNode.removeChild(note);
    }

    if (opts.action) {
      var action = document.createElement('button');
      action.type = 'button';
      action.className = 'note-action';
      action.textContent = opts.action.label;
      action.addEventListener('click', function () {
        opts.action.onClick();
        dismiss();
      });
      note.appendChild(action);
    }

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'note-close';
    close.setAttribute('aria-label', 'Dismiss notification');
    close.innerHTML = '&times;';
    close.addEventListener('click', dismiss);
    note.appendChild(close);

    notifications.appendChild(note);

    var ms = opts.timeout === undefined ? 6000 : opts.timeout;
    if (ms > 0) timer = setTimeout(dismiss, ms);
    return dismiss;
  }

  // Removal is undoable, so it asks no question first.
  function deleteTeam(id) {
    var index = -1;
    teams.forEach(function (t, i) { if (t.id === id) index = i; });
    if (index < 0) return;

    var removed = teams[index];
    teams.splice(index, 1);
    editing = null;
    save();
    render();

    notify('Removed "' + removed.name + '".', {
      timeout: 12000,
      action: {
        label: 'Undo',
        onClick: function () {
          teams.splice(Math.min(index, teams.length), 0, removed);
          save();
          render();
        }
      }
    });
  }

  // Moving straight from one editor to another, in a single click.
  function openEditor(id, field) {
    if (editing && editing.id === id && editing.field === field) return;
    flushOpenEditor();
    editing = { id: id, field: field };
    render();
  }

  // Walks round cells in the order currently shown on screen.
  function nextCell(from, step) {
    var order = rows();
    var row = order.findIndex(function (t) { return t.id === from.id; });
    if (row < 0) return null;

    var col = from.field === 'name' ? (step > 0 ? -1 : 0) : from.field;
    var next = col + step;

    if (next >= ROUNDS) { row += 1; next = 0; }
    else if (next < 0) { row -= 1; next = ROUNDS - 1; }
    if (row < 0 || row >= order.length) return null;

    return { id: order[row].id, field: next };
  }

  // Edit dialog -------------------------------------------------------------
  var roundFields = [];
  (function buildRoundFields() {
    var holder = document.getElementById('edit-rounds');
    for (var i = 0; i < ROUNDS; i++) {
      var field = document.createElement('label');
      field.className = 'field';
      field.htmlFor = 'edit-round-' + i;

      var caption = document.createElement('span');
      caption.textContent = 'Round ' + (i + 1);

      var input = document.createElement('input');
      input.id = 'edit-round-' + i;
      input.type = 'number';
      input.min = '0';
      input.max = '10';
      input.step = '0.5';
      input.inputMode = 'decimal';

      field.appendChild(caption);
      field.appendChild(input);
      holder.appendChild(field);
      roundFields.push(input);
    }
  })();

  // The name is quoted, and the full one stays reachable on hover when the
  // title has to cut it.
  function setModalTitle(name) {
    modalTitle.textContent = 'Edit "' + name + '"';
    modalTitle.title = name;
  }

  // What the field should be showing, straight from the team.
  function storedValue(index) {
    var team = byId(modalTeamId);
    if (!team) return '';
    if (index === 'name') return team.name;
    return team.scores[index] == null ? '' : String(team.scores[index]);
  }

  function focusedField() {
    if (document.activeElement === nameField) return { input: nameField, index: 'name' };
    var i = roundFields.indexOf(document.activeElement);
    return i >= 0 ? { input: roundFields[i], index: i } : null;
  }

  // Write one field into the team, then echo back what was actually stored:
  // 99 becomes 10 and a blank name springs back, so the field never disagrees
  // with the board behind it.
  function writeModalField(input, index) {
    var team = byId(modalTeamId);
    if (!team) return;

    if (index === 'name') {
      var name = input.value.trim();
      if (name) team.name = name;
      setModalTitle(team.name);
    } else {
      team.scores[index] = parseScore(input.value);
    }
    input.value = storedValue(index);
  }

  function commitModalField(input, index) {
    writeModalField(input, index);
    save();
    render();
  }

  // Catches whichever field still has focus when the dialog closes.
  function flushModalFields() {
    if (!modalTeamId) return;
    writeModalField(nameField, 'name');
    roundFields.forEach(function (input, i) { writeModalField(input, i); });
    save();
    render();
  }

  function openModal(id) {
    var team = byId(id);
    if (!team) return;

    // Only re-render when an inline editor is actually open: rendering
    // replaces the Edit button that should get focus back on close.
    if (editing) {
      flushOpenEditor();
      editing = null;
      render();
    }

    modalTeamId = id;
    modalSnapshot = { name: team.name, scores: team.scores.slice() };
    returnFocusTo = document.activeElement;
    setModalTitle(team.name);
    nameField.value = team.name;
    roundFields.forEach(function (input, i) {
      input.value = team.scores[i] == null ? '' : team.scores[i];
    });

    backdrop.hidden = false;
    // Focus the dialog, not a field: putting a caret in the name would open
    // the keyboard on a phone and select a name nobody asked to change. The
    // dialog still needs focus for Escape and the tab trap to reach it.
    modalBox.focus();
  }

  // silent skips the undo notification, for the delete path which posts
  // its own.
  function closeModal(silent) {
    var id = modalTeamId;
    var before = modalSnapshot;

    flushModalFields();

    var team = byId(id);
    var changed = !silent && team && before && (
      team.name !== before.name ||
      JSON.stringify(team.scores) !== JSON.stringify(before.scores)
    );

    backdrop.hidden = true;
    modalTeamId = null;
    modalSnapshot = null;

    // Prefer this row's current Edit button: a re-render may have replaced the
    // element that opened the dialog.
    var button = id && tbody.querySelector('tr[data-id="' + id + '"] td.edit button');
    if (button) button.focus();
    else if (returnFocusTo && document.contains(returnFocusTo)) returnFocusTo.focus();
    returnFocusTo = null;

    // Nothing here asked permission, so everything here can be taken back.
    if (changed) {
      notify('Updated "' + team.name + '".', {
        timeout: 12000,
        action: {
          label: 'Undo',
          onClick: function () {
            var current = byId(id);
            if (!current) return;
            current.name = before.name;
            current.scores = before.scores.slice();
            save();
            render();
          }
        }
      });
    }
  }

  document.getElementById('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    closeModal();
  });
  document.getElementById('edit-delete').addEventListener('click', function () {
    var id = modalTeamId;
    var team = byId(id);
    if (!team) return;
    if (!confirm('Remove "' + team.name + '"?')) return;
    closeModal(true);
    deleteTeam(id);
  });

  nameField.addEventListener('blur', function () { commitModalField(nameField, 'name'); });
  roundFields.forEach(function (input, i) {
    input.addEventListener('blur', function () { commitModalField(input, i); });
  });

  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) closeModal();   // not closeModal(event)
  });

  backdrop.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      // First Escape puts the focused field back, as it does in the table.
      // A second one, with nothing left to undo, closes the dialog.
      var field = focusedField();
      if (field && field.input.value !== storedValue(field.index)) {
        field.input.value = storedValue(field.index);
      } else {
        closeModal();
      }
      return;
    }
    if (e.key !== 'Tab') return;

    // Keep Tab inside the dialog while it is open.
    var stops = [].slice.call(backdrop.querySelectorAll('input, button'));
    if (!stops.length) return;
    var first = stops[0], last = stops[stops.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    flushOpenEditor();
    var field = document.getElementById('team-name');
    var name = field.value.trim();
    if (!name) return;

    var clash = teams.some(function (t) {
      return t.name.toLowerCase() === name.toLowerCase();
    });
    if (clash) {
      notify('There is already a team called "' + name + '". Both are on the board now.',
             { tone: 'warn', timeout: 8000 });
    }

    teams.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      seq: nextSeq(), name: name, scores: new Array(ROUNDS).fill(null)
    });
    field.value = '';
    field.focus();
    save();
    render();
  });

  tbody.addEventListener('mousedown', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var cell = e.target.closest('td[data-field]');
    if (!cell && !e.target.closest('td.edit')) return;

    // Stop the press from moving focus. Otherwise the open editor blurs, the
    // table re-renders, and the element being pressed is gone before mouseup -
    // so no click is ever dispatched and the press appears to do nothing.
    e.preventDefault();

    if (cell) {
      var field = cell.dataset.field;
      openEditor(row.dataset.id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('click', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var id = row.dataset.id;

    if (e.target.closest('td.edit')) {
      openModal(id);
      return;
    }

    var cell = e.target.closest('td[data-field]');
    if (cell) {
      var field = cell.dataset.field;
      openEditor(id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var cell = e.target.closest('td[data-field]');
    if (!cell) return;
    e.preventDefault();
    var field = cell.dataset.field;
    openEditor(cell.closest('tr').dataset.id, field === 'name' ? 'name' : +field);
  });

  document.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      flushOpenEditor();
      var key = th.dataset.sort;
      if (sort.key === key) sort.dir *= -1;
      else sort = { key: key, dir: (key === 'name' || key === 'seq') ? 1 : -1 };
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
