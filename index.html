<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Scoreboard</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e2e5e9;
    --hover: #f3f4f6;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --surface: #ffffff;
    --danger: #dc2626;
    --warn: #b45309;
    --overlay: rgba(17, 20, 26, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --ink: #e8eaed;
      --muted: #9aa0a6;
      --line: #32363c;
      --hover: #22262c;
      --accent: #6ea8fe;
      --accent-ink: #10151c;
      --surface: #1e2229;
      --danger: #f87171;
      --warn: #fbbf24;
      --overlay: rgba(0, 0, 0, .62);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 20px 12px 40px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }

  /* Title left, quiz actions top right. On a narrow screen the actions wrap
     to their own line and stay right-aligned rather than squashing the title. */
  .page-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-title { flex: 1 1 12em; min-width: 0; }
  .page-actions { display: flex; gap: 8px; flex: none; margin-left: auto; }
  .quiz-label {
    margin: 0; font-weight: 600; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Scoped: a bare `form` rule also caught the dialog's form and laid its
     sections out in a row. */
  #add-form { display: flex; gap: 8px; margin-bottom: 16px; }
  input, button { font: inherit; }
  /* 16px keeps iOS from zooming the page when a field takes focus. */
  #team-name, td input { font-size: 16px; }
  #team-name {
    flex: 1 1 auto; min-width: 0; padding: 8px 10px; min-height: 44px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  button {
    padding: 8px 14px; min-height: 44px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--hover); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  /* Secondary actions - page header, toolbar, dialog headers, quiz rows - are
     all this size. The primary controls (Add team, Close) keep 44px. */
  .btn-sm { padding: 6px 12px; min-height: 36px; font-size: 13px; }

  /* Actions split across a row: the safe ones on the left, the destructive
     one pushed to the right. Used by the toolbar and by each quiz row. */
  /* An auto margin rather than space-between: when the row wraps, the
     destructive button stays on the right of its own line too. */
  .actions-split { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions-split > :last-child { margin-left: auto; }
  .actions-group { display: flex; gap: 8px; flex-wrap: wrap; }

  .toolbar { margin-top: 12px; }

  .quiz-list { display: flex; flex-direction: column; gap: 10px; }
  .quiz-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px; border: 1px solid var(--line); border-radius: 6px;
  }
  .quiz-row.is-current { border-color: var(--accent); }
  .quiz-row-name {
    width: 100%; padding: 6px 8px; min-height: 40px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  .quiz-row-meta { font-size: 12px; color: var(--muted); }
  #quizzes-new { flex: none; }

  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: right; }
  th:nth-child(2), td.name { text-align: left; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--ink); }
  th[aria-sort]::after { content: " \25B2"; font-size: 9px; }
  th[aria-sort="descending"]::after { content: " \25BC"; }

  td.seq { color: var(--muted); width: 1%; font-variant-numeric: tabular-nums; }
  /* Total and rank are one line: without this the column wraps to two rows. */
  td.total { width: 1%; white-space: nowrap; }
  .total-position {
    display: inline-flex;
    width: 100%;
    justify-content: space-between;
  }
  .rank { margin-left: 4px; font-size: 14px; font-weight: 500; }
  .rank-indicator { font-size: 9px; color: var(--muted); }
  tr.first td.total, tr.first td.name { font-weight: 700; color: var(--ink); }
  tr.first .rank { color: var(--ink); }
  td.name { cursor: text; }
  td.score { cursor: pointer; width: 54px; }
  td.score:hover, td.name:hover { background: var(--hover); }
  td.score:focus-visible, td.name:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.empty-score { color: var(--muted); }
  td.total { font-weight: 600; }
  td.edit { width: 1%; padding: 0 0 0 4px; }
  td.edit button {
    padding: 4px 8px; min-height: 30px; font-size: 12px;
    color: var(--muted); background: none; border-color: transparent;
  }
  td.edit button:hover { color: var(--ink); border-color: var(--line); }

  td input {
    width: 100%; padding: 2px 4px; text-align: right;
    border: 1px solid var(--accent); border-radius: 3px;
    background: var(--bg); color: var(--ink);
  }
  td.name input { text-align: left; }
  /* Spinner arrows waste the little width a score cell has. */
  td input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  td input::-webkit-outer-spin-button,
  td input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .pl-short { display: none; }

  #hint { color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Notifications ---------------------------------------------------------- */
  /* Above the dialog backdrops (30): a quiz is deleted from inside the list,
     which stays open, so its Undo has to stay clickable. */
  .notifications {
    position: fixed; z-index: 40;
    left: 50%; transform: translateX(-50%); bottom: 16px;
    width: min(440px, calc(100vw - 24px));
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;            /* only the notes themselves take clicks */
  }
  .note {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 14px;
    border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .18);
    font-size: 14px;
  }
  .note-warn { border-left-color: var(--warn); }
  .note-text { flex: 1; min-width: 0; }
  .note-action { padding: 5px 10px; min-height: 0; font-size: 13px; white-space: nowrap; }
  .note-close {
    padding: 0; width: 28px; min-height: 28px; flex: none;
    border-color: transparent; background: none; color: var(--muted);
    font-size: 17px; line-height: 1;
  }
  .note-close:hover { color: var(--ink); border-color: var(--line); }

  /* Edit dialog ------------------------------------------------------------ */
  .backdrop {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--overlay);
  }
  .modal {
    width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 18px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .32);
  }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  /* The title takes the room that is left and cuts the name, rather than
     pushing Delete off the edge. min-width:0 is what lets a flex item shrink
     below its content. */
  .modal:focus { outline: none; }
  .modal h2 {
    margin: 0; font-size: 17px; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #edit-delete { flex: none; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  }
  .field input {
    padding: 8px 10px; min-height: 44px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  #edit-rounds {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  #edit-rounds .field input { text-align: center; padding: 8px 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .danger { color: var(--danger); }
  .danger:hover { border-color: var(--danger); }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .primary:hover { border-color: var(--accent); filter: brightness(1.08); }

  @media (max-width: 620px) {
    body { padding: 16px 12px 40px; }
    th, td { padding: 4px 4px; }
    /* ~44px rows so a score cell is a comfortable tap target. */
    td.score { width: 40px; height: 44px; padding: 0; text-align: center; }
    /* No columns are pinned: the whole table fits from ~320px up with typical
       scores (~330px if every round is a 10), so there is no hand-kept offset
       to match a rendered width. Narrower than that, .wrap scrolls sideways. */
    th:first-child, td.seq {
      /* width on a table cell cannot beat min-content, so shrink the content. */
      font-size: 12px; padding-left: 2px; padding-right: 2px;
    }
    th:nth-child(2), td.name {
      max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    td.name input { max-width: 100%; }
    .rp, .pl-full { display: none; }
    .pl-short { display: inline; }
    td input { text-align: center; padding: 2px 0; }
    /* Keep the whole table inside a 360px screen: no sideways scroll. */
    td.edit { padding: 0; }
    td.edit button { padding: 4px 5px; min-height: 32px; font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <div class="page-title">
      <h1>Quiz Scoreboard</h1>
      <p id="quiz-label" class="quiz-label"></p>
    </div>
    <div class="page-actions">
      <button type="button" id="new-quiz" class="btn-sm">New quiz</button>
      <button type="button" id="show-quizzes" class="btn-sm">Quizzes</button>
    </div>
  </div>

  <form id="add-form">
    <input id="team-name" placeholder="Team name" autocomplete="off" maxlength="40">
    <button type="submit">Add team</button>
  </form>

  <div class="wrap">
    <table id="board">
      <thead>
        <tr>
          <th data-sort="seq" title="Order teams were added">#</th>
          <th data-sort="name" title="Sort by name">Team</th>
          <th data-sort="r0"><span class="rp">R</span>1</th>
          <th data-sort="r1"><span class="rp">R</span>2</th>
          <th data-sort="r2"><span class="rp">R</span>3</th>
          <th data-sort="r3"><span class="rp">R</span>4</th>
          <th data-sort="r4"><span class="rp">R</span>5</th>
          <th data-sort="total" title="Sort by total, which is also the order of places"><span class="pl-full">Total</span><span class="pl-short">Tot</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p id="hint">Tap a round cell to enter points. Enter moves to the next one.</p>

  <div class="toolbar actions-split">
    <span class="actions-group">
      <button type="button" id="copy-csv" class="btn-sm">Copy as CSV</button>
      <button type="button" id="reuse-quiz" class="btn-sm">Reuse teams in new quiz</button>
    </span>
    <button type="button" id="delete-quiz" class="btn-sm danger">Delete quiz</button>
  </div>
</main>

<div id="notifications" class="notifications" role="status" aria-live="polite"></div>

<div id="quizzes-backdrop" class="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quizzes-title" tabindex="-1">
    <div class="modal-head">
      <h2 id="quizzes-title">Stored quizzes</h2>
      <button type="button" id="quizzes-new" class="btn-sm">New quiz</button>
    </div>
    <div id="quiz-list" class="quiz-list"></div>
    <div class="modal-actions">
      <button type="button" id="quizzes-close" class="primary">Close</button>
    </div>
  </div>
</div>

<div id="modal-backdrop" class="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal-head">
      <h2 id="modal-title">Edit team</h2>
      <button type="button" id="edit-delete" class="btn-sm danger">Delete team</button>
    </div>
    <!-- novalidate: out-of-range values are clamped by parseScore, the same way
         the inline editor treats them, instead of blocking the save. -->
    <form id="edit-form" novalidate>
      <label class="field" for="edit-name"><span>Team name</span>
        <input id="edit-name" type="text" maxlength="40" autocomplete="off">
      </label>
      <div id="edit-rounds"></div>
      <div class="modal-actions">
        <button type="submit" id="edit-done" class="primary">Close</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var KEY = 'quiz-scoreboard';
  var ROUNDS = 5;

  var store = load();                  // { version, quizzes: [...], currentId }
  var teams = currentQuiz().teams;     // the board on screen
  // Highest total first, which is the same thing as first place first.
  var sort = { key: 'total', dir: -1 };
  var editing = null;      // { id: teamId, field: 'name' | roundIndex }
  var activeInput = null;

  var tbody = document.querySelector('#board tbody');
  var notifications = document.getElementById('notifications');
  var backdrop = document.getElementById('modal-backdrop');
  var modalBox = backdrop.querySelector('.modal');
  var modalTitle = document.getElementById('modal-title');
  var nameField = document.getElementById('edit-name');
  var modalTeamId = null;
  var modalSnapshot = null;
  var returnFocusTo = null;

  var quizLabel = document.getElementById('quiz-label');
  var quizzesBackdrop = document.getElementById('quizzes-backdrop');
  var quizzesBox = quizzesBackdrop.querySelector('.modal');
  var quizList = document.getElementById('quiz-list');
  var quizzesReturnFocusTo = null;

  function makeId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function formatDate(ms) {
    var when = new Date(ms);
    try {
      return when.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
      return when.toISOString().slice(0, 10);
    }
  }

  function defaultQuizName() {
    return 'Quiz ' + formatDate(Date.now());
  }

  function normaliseTeam(t, i) {
    var scores = Array.isArray(t.scores) ? t.scores.slice(0, ROUNDS) : [];
    while (scores.length < ROUNDS) scores.push(null);
    // Boards saved before the # column existed get numbered by stored order.
    return {
      id: t.id || makeId(),
      seq: isFinite(t.seq) ? t.seq : i + 1,
      name: String(t.name),
      scores: scores,
    };
  }

  function makeQuiz(name, teamList) {
    return { id: makeId(), name: name, created: Date.now(), teams: teamList || [] };
  }

  function freshStore() {
    var quiz = makeQuiz(defaultQuizName());
    return { version: 2, quizzes: [quiz], currentId: quiz.id };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);

        // Version 1 stored a bare array of teams. That board becomes the
        // first quiz rather than being thrown away.
        if (Array.isArray(parsed)) {
          var carried = makeQuiz(defaultQuizName(), parsed.map(normaliseTeam));
          return { version: 2, quizzes: [carried], currentId: carried.id };
        }

        if (parsed && Array.isArray(parsed.quizzes) && parsed.quizzes.length) {
          var quizzes = parsed.quizzes.map(function (q) {
            return {
              id: q.id || makeId(),
              name: String(q.name || defaultQuizName()),
              created: isFinite(q.created) ? q.created : Date.now(),
              teams: (Array.isArray(q.teams) ? q.teams : []).map(normaliseTeam),
            };
          });
          var known = quizzes.some(function (q) { return q.id === parsed.currentId; });
          return { version: 2, quizzes: quizzes, currentId: known ? parsed.currentId : quizzes[0].id };
        }
      }
    } catch (e) {
      // unreadable storage falls through to a fresh board
    }
    return freshStore();
  }

  function quizById(id) {
    return store.quizzes.filter(function (q) { return q.id === id; })[0];
  }

  function currentQuiz() {
    var found = quizById(store.currentId);
    if (!found) {
      if (!store.quizzes.length) store.quizzes.push(makeQuiz(defaultQuizName()));
      found = store.quizzes[0];
      store.currentId = found.id;
    }
    return found;
  }

  // Everything that swaps the board goes through here, so `teams` never ends
  // up pointing at a quiz that is no longer on screen.
  function showQuiz(id) {
    store.currentId = id;
    teams = currentQuiz().teams;
    editing = null;
    save();
    render();
  }

  function addQuiz(name, teamList) {
    var quiz = makeQuiz(name, teamList || []);
    store.quizzes.push(quiz);
    showQuiz(quiz.id);
    renderQuizList();
    return quiz;
  }

  // Same teams, clean sheet, renumbered from one.
  function teamsCarriedFrom(quiz) {
    return quiz.teams.map(function (t, i) {
      return { id: makeId(), seq: i + 1, name: t.name, scores: new Array(ROUNDS).fill(null) };
    });
  }

  // Never reused, so a team keeps its number when an earlier team is removed.
  function nextSeq() {
    return teams.reduce(function (m, t) { return Math.max(m, t.seq); }, 0) + 1;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  function ordinalSuffix(n) {
    var suffix = ['th', 'st', 'nd', 'rd'];
    var v = n % 100;
    return (suffix[(v - 20) % 10] || suffix[v] || suffix[0]);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Totals, places (ties share a place), then the chosen sort order.
  function rows() {
    var list = teams.map(function (t) {
      var total = t.scores.reduce(function (a, v) { return a + (v || 0); }, 0);
      return { id: t.id, seq: t.seq, name: t.name, scores: t.scores, total: total, place: 0 };
    });

    var byTotal = list.slice().sort(function (a, b) { return b.total - a.total; });
    byTotal.forEach(function (t, i) {
      t.place = (i > 0 && byTotal[i - 1].total === t.total) ? byTotal[i - 1].place : i + 1;
    });

    var key = sort.key;
    list.sort(function (a, b) {
      var v;
      if (key === 'seq') v = a.seq - b.seq;
      else if (key === 'name') v = a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      else if (key === 'total') v = a.total - b.total;
      else {
        var i = +key.slice(1);
        v = (a.scores[i] == null ? -1 : a.scores[i]) - (b.scores[i] == null ? -1 : b.scores[i]);
      }
      return (v * sort.dir) || (a.place - b.place) || a.name.localeCompare(b.name);
    });
    return list;
  }

  function render() {
    if (activeInput) { activeInput.onblur = null; activeInput = null; }

    var list = rows();

    tbody.innerHTML = list.map(function (t) {
      var cells = t.scores.map(function (s, i) {
        if (editing && editing.id === t.id && editing.field === i) {
          return '<td class="score"><input type="number" min="0" max="10" step="0.5" ' +
                 'inputmode="decimal" enterkeyhint="next" value="' + (s == null ? '' : s) + '"></td>';
        }
        return '<td class="score' + (s == null ? ' empty-score' : '') + '" tabindex="0" ' +
               'data-field="' + i + '">' + (s == null ? '&ndash;' : s) + '</td>';
      }).join('');

      var name = (editing && editing.id === t.id && editing.field === 'name')
        ? '<td class="name"><input type="text" maxlength="40" enterkeyhint="done" value="' + esc(t.name) + '"></td>'
        : '<td class="name" tabindex="0" data-field="name" title="' + esc(t.name) + '">' + esc(t.name) + '</td>';

      return '<tr data-id="' + t.id + '"' + (t.place === 1 ? ' class="first"' : '') + '>' +
        '<td class="seq">' + t.seq + '</td>' +
        name + cells +
        '<td class="total">' +
          '<span class="total-position">' +
            t.total +
            '<span>' +
            ' <span class="rank">' + t.place + '</span><span class="rank-indicator">' + ordinalSuffix(t.place) + '</span>' +
            '</span>' +
            '</span>' +
        '</td>' +
        '<td class="edit"><button type="button" aria-label="Edit ' + esc(t.name) + '">✎</button></td>' +
      '</tr>';
    }).join('');

    if (!teams.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:left;color:var(--muted)">' +
                        'No teams yet &mdash; add one above.</td></tr>';
    }

    document.querySelectorAll('th[data-sort]').forEach(function (th) {
      if (th.dataset.sort === sort.key) {
        th.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending');
      } else {
        th.removeAttribute('aria-sort');
      }
    });

    updateQuizLabel();

    var input = tbody.querySelector('input');
    if (input) {
      activeInput = input;
      input.focus();
      input.select();
      input.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      input.onblur = function () { commit(input.value); };
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(input.value, 1); }
        else if (e.key === 'Escape') { e.preventDefault(); editing = null; render(); }
        else if (e.key === 'Tab') { e.preventDefault(); commit(input.value, e.shiftKey ? -1 : 1); }
      };
    }
  }

  // Write an editor's value back to the model, without re-rendering.
  // Blank clears the score; anything else lands on 0-10, nearest half point.
  function parseScore(value) {
    var raw = String(value).trim();
    var n = Number(raw);
    if (raw === '' || !isFinite(n)) return null;
    return Math.max(0, Math.min(10, Math.round(n * 2) / 2));
  }

  function byId(id) {
    return teams.filter(function (t) { return t.id === id; })[0];
  }

  function applyEdit(target, value) {
    var team = byId(target.id);
    if (!team) return;

    if (target.field === 'name') {
      var name = value.trim();
      if (name) team.name = name;
    } else {
      team.scores[target.field] = parseScore(value);
    }
    save();
  }

  // Save whatever editor is open, so switching away never drops a keystroke.
  function flushOpenEditor() {
    if (editing && activeInput) applyEdit(editing, activeInput.value);
  }

  function commit(value, step) {
    if (!editing) return;
    var target = editing;
    applyEdit(target, value);
    editing = step ? nextCell(target, step) : null;
    render();
  }

  // CSV ---------------------------------------------------------------------
  // RFC 4180: quote anything holding a comma, quote or newline, and double
  // the quotes inside it.
  function csvCell(value) {
    var text = value == null ? '' : String(value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  // The board as it is on screen, in the order it is sorted. The add-order
  // number and the place are left out: both are derivable, and a spreadsheet
  // can rank the totals itself.
  function boardAsCsv() {
    var header = ['Team'];
    for (var i = 0; i < ROUNDS; i++) header.push('R' + (i + 1));
    header.push('Total');

    var lines = [header.join(',')];
    rows().forEach(function (t) {
      var cells = [t.name]
        .concat(t.scores.map(function (score) { return score == null ? '' : score; }))
        .concat([t.total]);
      lines.push(cells.map(csvCell).join(','));
    });
    return lines.join('\r\n');
  }

  // execCommand is deprecated but it is the only thing that works when the
  // page is opened from a file:// URL, where the clipboard API is missing.
  function copyViaTextarea(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.top = '-1000px';
    document.body.appendChild(area);
    area.select();

    var copied = false;
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
    document.body.removeChild(area);
    return copied;
  }

  function copiedMessage() {
    return 'Copied ' + teams.length + (teams.length === 1 ? ' team' : ' teams') + ' as CSV.';
  }

  function copyFailed() {
    notify('Could not reach the clipboard. Your browser may be blocking it.',
           { tone: 'warn', timeout: 8000 });
  }

  document.getElementById('copy-csv').addEventListener('click', function () {
    if (!teams.length) {
      notify('There is nothing to copy yet.', { tone: 'warn' });
      return;
    }

    var csv = boardAsCsv();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(
        function () { notify(copiedMessage()); },
        function () { if (copyViaTextarea(csv)) notify(copiedMessage()); else copyFailed(); }
      );
    } else if (copyViaTextarea(csv)) {
      notify(copiedMessage());
    } else {
      copyFailed();
    }
  });

  // Notifications ----------------------------------------------------------
  // notify(message, { action: { label, onClick }, tone: 'warn', timeout: ms })
  // timeout 0 keeps it up until the close button is used.
  function notify(message, opts) {
    opts = opts || {};

    var note = document.createElement('div');
    note.className = 'note' + (opts.tone ? ' note-' + opts.tone : '');

    var text = document.createElement('span');
    text.className = 'note-text';
    text.textContent = message;
    note.appendChild(text);

    var timer;
    function dismiss() {
      clearTimeout(timer);
      if (note.parentNode) note.parentNode.removeChild(note);
    }

    if (opts.action) {
      var action = document.createElement('button');
      action.type = 'button';
      action.className = 'note-action';
      action.textContent = opts.action.label;
      action.addEventListener('click', function () {
        opts.action.onClick();
        dismiss();
      });
      note.appendChild(action);
    }

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'note-close';
    close.setAttribute('aria-label', 'Dismiss notification');
    close.innerHTML = '&times;';
    close.addEventListener('click', dismiss);
    note.appendChild(close);

    notifications.appendChild(note);

    var ms = opts.timeout === undefined ? 6000 : opts.timeout;
    if (ms > 0) timer = setTimeout(dismiss, ms);
    return dismiss;
  }

  // Removal is undoable, so it asks no question first.
  function deleteTeam(id) {
    var list = teams;                  // captured: the board may be swapped before Undo
    var index = -1;
    list.forEach(function (t, i) { if (t.id === id) index = i; });
    if (index < 0) return;

    var removed = list[index];
    list.splice(index, 1);
    editing = null;
    save();
    render();

    notify('Removed "' + removed.name + '".', {
      timeout: 12000,
      action: {
        label: 'Undo',
        onClick: function () {
          list.splice(Math.min(index, list.length), 0, removed);
          save();
          render();
        }
      }
    });
  }

  // Moving straight from one editor to another, in a single click.
  function openEditor(id, field) {
    if (editing && editing.id === id && editing.field === field) return;
    flushOpenEditor();
    editing = { id: id, field: field };
    render();
  }

  // Walks round cells in the order currently shown on screen.
  function nextCell(from, step) {
    var order = rows();
    var row = order.findIndex(function (t) { return t.id === from.id; });
    if (row < 0) return null;

    var col = from.field === 'name' ? (step > 0 ? -1 : 0) : from.field;
    var next = col + step;

    if (next >= ROUNDS) { row += 1; next = 0; }
    else if (next < 0) { row -= 1; next = ROUNDS - 1; }
    if (row < 0 || row >= order.length) return null;

    return { id: order[row].id, field: next };
  }

  // Quizzes -----------------------------------------------------------------
  function updateQuizLabel() {
    var quiz = currentQuiz();
    quizLabel.textContent = quiz.name;
    quizLabel.title = quiz.name;
  }

  function teamCount(quiz) {
    return quiz.teams.length + (quiz.teams.length === 1 ? ' team' : ' teams');
  }

  function renderQuizList() {
    updateQuizLabel();

    var newestFirst = store.quizzes.slice().sort(function (a, b) { return b.created - a.created; });
    quizList.innerHTML = newestFirst.map(function (q) {
      var showing = q.id === store.currentId;
      return '<div class="quiz-row' + (showing ? ' is-current' : '') + '" data-quiz="' + q.id + '">' +
        '<input class="quiz-row-name" type="text" maxlength="60" aria-label="Quiz name" value="' + esc(q.name) + '">' +
        '<span class="quiz-row-meta">' + teamCount(q) + ' &middot; ' + esc(formatDate(q.created)) +
          (showing ? ' &middot; active' : '') + '</span>' +
        '<div class="actions-split">' +
          '<span class="actions-group">' +
            (showing ? '' : '<button type="button" class="btn-sm" data-act="open">Open</button>') +
            '<button type="button" class="btn-sm" data-act="reuse">Reuse teams in new quiz</button>' +
          '</span>' +
          '<button type="button" class="btn-sm danger" data-act="delete">Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function openQuizzes() {
    flushOpenEditor();
    if (editing) { editing = null; render(); }
    renderQuizList();
    quizzesReturnFocusTo = document.activeElement;
    quizzesBackdrop.hidden = false;
    quizzesBox.focus();
  }

  function closeQuizzes() {
    quizzesBackdrop.hidden = true;
    if (quizzesReturnFocusTo && document.contains(quizzesReturnFocusTo)) quizzesReturnFocusTo.focus();
    quizzesReturnFocusTo = null;
  }

  function askForName(message) {
    var suggested = defaultQuizName();
    var answer = prompt(message, suggested);
    if (answer === null) return null;              // cancelled
    return answer.trim() || suggested;
  }

  function startNewQuiz() {
    var name = askForName('Name for the new quiz');
    if (name === null) return;
    addQuiz(name, []);
    closeQuizzes();
    notify('Started "' + name + '". The previous quiz is kept under Quizzes.');
  }

  function reuseTeamsFrom(id) {
    var source = quizById(id);
    if (!source) return;
    if (!source.teams.length) {
      notify('"' + source.name + '" has no teams to carry over.', { tone: 'warn' });
      return;
    }

    var name = askForName('Name for the new quiz');
    if (name === null) return;

    addQuiz(name, teamsCarriedFrom(source));
    closeQuizzes();
    notify('Started "' + name + '" with ' + teamCount(source) + ' from "' + source.name + '", scores cleared.');
  }

  function renameQuiz(id, value) {
    var quiz = quizById(id);
    if (!quiz) return;
    var name = value.trim();
    if (name) quiz.name = name;
    save();
    updateQuizLabel();
    return quiz.name;
  }

  function deleteQuiz(id) {
    var index = -1;
    store.quizzes.forEach(function (q, i) { if (q.id === id) index = i; });
    if (index < 0) return;

    var removed = store.quizzes[index];
    if (!confirm('Delete "' + removed.name + '" and its scores?')) return;

    var wasShowing = store.currentId === id;
    store.quizzes.splice(index, 1);

    // The board always shows something, so removing the last quiz leaves an
    // empty one behind - which Undo has to clear up again.
    var filler = null;
    if (!store.quizzes.length) {
      filler = makeQuiz(defaultQuizName());
      store.quizzes.push(filler);
    }
    if (wasShowing) store.currentId = store.quizzes[Math.min(index, store.quizzes.length - 1)].id;

    teams = currentQuiz().teams;
    editing = null;
    save();
    render();
    renderQuizList();

    notify('Deleted "' + removed.name + '".', {
      timeout: 12000,
      action: {
        label: 'Undo',
        onClick: function () {
          if (filler && !filler.teams.length) {
            var at = store.quizzes.indexOf(filler);
            if (at >= 0) store.quizzes.splice(at, 1);
          }
          store.quizzes.splice(Math.min(index, store.quizzes.length), 0, removed);
          if (wasShowing) store.currentId = removed.id;
          teams = currentQuiz().teams;
          save();
          render();
          renderQuizList();
        }
      }
    });
  }

  document.getElementById('new-quiz').addEventListener('click', startNewQuiz);
  document.getElementById('quizzes-new').addEventListener('click', startNewQuiz);
  document.getElementById('show-quizzes').addEventListener('click', openQuizzes);
  document.getElementById('reuse-quiz').addEventListener('click', function () {
    reuseTeamsFrom(store.currentId);
  });
  document.getElementById('delete-quiz').addEventListener('click', function () {
    deleteQuiz(store.currentId);
  });
  document.getElementById('quizzes-close').addEventListener('click', function () { closeQuizzes(); });
  quizzesBackdrop.addEventListener('click', function (e) {
    if (e.target === quizzesBackdrop) closeQuizzes();
  });

  quizList.addEventListener('click', function (e) {
    var button = e.target.closest('button[data-act]');
    if (!button) return;
    var id = button.closest('[data-quiz]').dataset.quiz;

    if (button.dataset.act === 'open') {
      showQuiz(id);
      renderQuizList();
      closeQuizzes();
    } else if (button.dataset.act === 'reuse') {
      reuseTeamsFrom(id);
    } else {
      deleteQuiz(id);
    }
  });

  // Renaming writes through on blur. The list is deliberately NOT rebuilt
  // here: focusout runs before the click that caused it, and replacing the
  // rows would destroy the button being pressed.
  quizList.addEventListener('focusout', function (e) {
    if (!e.target.classList.contains('quiz-row-name')) return;
    var id = e.target.closest('[data-quiz]').dataset.quiz;
    e.target.value = renameQuiz(id, e.target.value);
  });

  // Edit dialog -------------------------------------------------------------
  var roundFields = [];
  (function buildRoundFields() {
    var holder = document.getElementById('edit-rounds');
    for (var i = 0; i < ROUNDS; i++) {
      var field = document.createElement('label');
      field.className = 'field';
      field.htmlFor = 'edit-round-' + i;

      var caption = document.createElement('span');
      caption.textContent = 'Round ' + (i + 1);

      var input = document.createElement('input');
      input.id = 'edit-round-' + i;
      input.type = 'number';
      input.min = '0';
      input.max = '10';
      input.step = '0.5';
      input.inputMode = 'decimal';

      field.appendChild(caption);
      field.appendChild(input);
      holder.appendChild(field);
      roundFields.push(input);
    }
  })();

  // The name is quoted, and the full one stays reachable on hover when the
  // title has to cut it.
  function setModalTitle(name) {
    modalTitle.textContent = 'Edit "' + name + '"';
    modalTitle.title = name;
  }

  // What the field should be showing, straight from the team.
  function storedValue(index) {
    var team = byId(modalTeamId);
    if (!team) return '';
    if (index === 'name') return team.name;
    return team.scores[index] == null ? '' : String(team.scores[index]);
  }

  function focusedField() {
    if (document.activeElement === nameField) return { input: nameField, index: 'name' };
    var i = roundFields.indexOf(document.activeElement);
    return i >= 0 ? { input: roundFields[i], index: i } : null;
  }

  // Write one field into the team, then echo back what was actually stored:
  // 99 becomes 10 and a blank name springs back, so the field never disagrees
  // with the board behind it.
  function writeModalField(input, index) {
    var team = byId(modalTeamId);
    if (!team) return;

    if (index === 'name') {
      var name = input.value.trim();
      if (name) team.name = name;
      setModalTitle(team.name);
    } else {
      team.scores[index] = parseScore(input.value);
    }
    input.value = storedValue(index);
  }

  function commitModalField(input, index) {
    writeModalField(input, index);
    save();
    render();
  }

  // Catches whichever field still has focus when the dialog closes.
  function flushModalFields() {
    if (!modalTeamId) return;
    writeModalField(nameField, 'name');
    roundFields.forEach(function (input, i) { writeModalField(input, i); });
    save();
    render();
  }

  function openModal(id) {
    var team = byId(id);
    if (!team) return;

    // Only re-render when an inline editor is actually open: rendering
    // replaces the Edit button that should get focus back on close.
    if (editing) {
      flushOpenEditor();
      editing = null;
      render();
    }

    modalTeamId = id;
    modalSnapshot = { name: team.name, scores: team.scores.slice() };
    returnFocusTo = document.activeElement;
    setModalTitle(team.name);
    nameField.value = team.name;
    roundFields.forEach(function (input, i) {
      input.value = team.scores[i] == null ? '' : team.scores[i];
    });

    backdrop.hidden = false;
    // Focus the dialog, not a field: putting a caret in the name would open
    // the keyboard on a phone and select a name nobody asked to change. The
    // dialog still needs focus for Escape and the tab trap to reach it.
    modalBox.focus();
  }

  // silent skips the undo notification, for the delete path which posts
  // its own.
  function closeModal(silent) {
    var id = modalTeamId;
    var before = modalSnapshot;

    flushModalFields();

    var team = byId(id);
    var changed = !silent && team && before && (
      team.name !== before.name ||
      JSON.stringify(team.scores) !== JSON.stringify(before.scores)
    );

    backdrop.hidden = true;
    modalTeamId = null;
    modalSnapshot = null;

    // Prefer this row's current Edit button: a re-render may have replaced the
    // element that opened the dialog.
    var button = id && tbody.querySelector('tr[data-id="' + id + '"] td.edit button');
    if (button) button.focus();
    else if (returnFocusTo && document.contains(returnFocusTo)) returnFocusTo.focus();
    returnFocusTo = null;

    // Nothing here asked permission, so everything here can be taken back.
    if (changed) {
      notify('Updated "' + team.name + '".', {
        timeout: 12000,
        action: {
          label: 'Undo',
          onClick: function () {
            var current = byId(id);
            if (!current) return;
            current.name = before.name;
            current.scores = before.scores.slice();
            save();
            render();
          }
        }
      });
    }
  }

  document.getElementById('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    closeModal();
  });
  document.getElementById('edit-delete').addEventListener('click', function () {
    var id = modalTeamId;
    var team = byId(id);
    if (!team) return;
    if (!confirm('Remove "' + team.name + '"?')) return;
    closeModal(true);
    deleteTeam(id);
  });

  nameField.addEventListener('blur', function () { commitModalField(nameField, 'name'); });
  roundFields.forEach(function (input, i) {
    input.addEventListener('blur', function () { commitModalField(input, i); });
  });

  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) closeModal();   // not closeModal(event)
  });

  // Escape and Tab are handled for whichever dialog is open, on the document
  // rather than on the backdrop: pressing a notification's button moves focus
  // out of the dialog, and a listener bound to the backdrop stops hearing
  // anything at that point.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Tab') return;

    var openBackdrop = !backdrop.hidden ? backdrop : (!quizzesBackdrop.hidden ? quizzesBackdrop : null);
    if (!openBackdrop) return;

    if (e.key === 'Escape') {
      e.preventDefault();
      if (openBackdrop !== backdrop) { closeQuizzes(); return; }

      // First Escape puts the focused field back, as it does in the table.
      // A second one, with nothing left to undo, closes the dialog.
      var field = focusedField();
      if (field && field.input.value !== storedValue(field.index)) {
        field.input.value = storedValue(field.index);
      } else {
        closeModal();
      }
      return;
    }

    // Keep Tab inside the dialog, and bring it back if a notification took it.
    var stops = [].slice.call(openBackdrop.querySelectorAll('input, button'));
    if (!stops.length) return;
    var first = stops[0], last = stops[stops.length - 1];

    if (!openBackdrop.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    flushOpenEditor();
    var field = document.getElementById('team-name');
    var name = field.value.trim();
    if (!name) return;

    var clash = teams.some(function (t) {
      return t.name.toLowerCase() === name.toLowerCase();
    });
    if (clash) {
      notify('There is already a team called "' + name + '". Pick a different name.',
             { tone: 'warn', timeout: 8000 });
      field.select();          // the name stays put so it can be edited
      return;
    }

    teams.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      seq: nextSeq(), name: name, scores: new Array(ROUNDS).fill(null)
    });
    field.value = '';
    field.focus();
    save();
    render();
  });

  tbody.addEventListener('mousedown', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var cell = e.target.closest('td[data-field]');
    if (!cell && !e.target.closest('td.edit')) return;

    // Stop the press from moving focus. Otherwise the open editor blurs, the
    // table re-renders, and the element being pressed is gone before mouseup -
    // so no click is ever dispatched and the press appears to do nothing.
    e.preventDefault();

    if (cell) {
      var field = cell.dataset.field;
      openEditor(row.dataset.id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('click', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var id = row.dataset.id;

    if (e.target.closest('td.edit')) {
      openModal(id);
      return;
    }

    var cell = e.target.closest('td[data-field]');
    if (cell) {
      var field = cell.dataset.field;
      openEditor(id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var cell = e.target.closest('td[data-field]');
    if (!cell) return;
    e.preventDefault();
    var field = cell.dataset.field;
    openEditor(cell.closest('tr').dataset.id, field === 'name' ? 'name' : +field);
  });

  document.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      flushOpenEditor();
      var key = th.dataset.sort;
      if (sort.key === key) sort.dir *= -1;
      else sort = { key: key, dir: (key === 'name' || key === 'seq') ? 1 : -1 };
      render();
    });
  });

  // Write once on load so a board stored in an older shape is migrated on the
  // spot, rather than staying v1 until something happens to change it.
  save();
  render();
  renderQuizList();
})();
</script>
</body>
</html>
