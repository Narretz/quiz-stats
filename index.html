<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Scoreboard</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e2e5e9;
    --hover: #f3f4f6;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --ink: #e8eaed;
      --muted: #9aa0a6;
      --line: #32363c;
      --hover: #22262c;
      --accent: #6ea8fe;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 12px 40px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input, button { font: inherit; }
  /* 16px keeps iOS from zooming the page when a field takes focus. */
  #team-name, td input { font-size: 16px; }
  #team-name {
    flex: 1 1 auto; min-width: 0; padding: 8px 10px; min-height: 44px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink);
  }
  button {
    padding: 8px 14px; min-height: 44px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--hover); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }

  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: right; }
  th:nth-child(2), td.name { text-align: left; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--ink); }
  th[aria-sort]::after { content: " \25B2"; font-size: 9px; }
  th[aria-sort="descending"]::after { content: " \25BC"; }

  td.seq { color: var(--muted); width: 1%; font-variant-numeric: tabular-nums; }
  td.place { width: 1%; font-weight: 600; }
  tr.first td.place, tr.first td.name { font-weight: 700; color: var(--ink); }
  td.name { cursor: text; }
  td.score { cursor: pointer; width: 54px; }
  td.score:hover, td.name:hover { background: var(--hover); }
  td.score:focus-visible, td.name:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.empty-score { color: var(--muted); }
  td.total { font-weight: 600; }
  td.del { width: 1%; padding: 0 4px 0 0; }
  td.del button {
    width: 36px; min-height: 36px; padding: 0; border-color: transparent;
    background: none; color: var(--muted); font-size: 18px; line-height: 1;
  }
  td.del button:hover { color: #dc2626; border-color: var(--line); }

  td input {
    width: 100%; padding: 2px 4px; text-align: right;
    border: 1px solid var(--accent); border-radius: 3px;
    background: var(--bg); color: var(--ink);
  }
  td.name input { text-align: left; }
  /* Spinner arrows waste the little width a score cell has. */
  td input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  td input::-webkit-outer-spin-button,
  td input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .pl-short { display: none; }
  th.seq-h { text-align: right; }

  #hint { color: var(--muted); font-size: 13px; margin-top: 14px; }

  @media (max-width: 620px) {
    body { padding: 16px 12px 40px; }
    th, td { padding: 4px 4px; }
    /* ~44px rows so a score cell is a comfortable tap target. */
    td.score { width: 40px; height: 44px; padding: 0; text-align: center; }
    /* No columns are pinned: the whole table fits from ~320px up with typical
       scores (~330px if every round is a 10), so there is no hand-kept offset
       to match a rendered width. Narrower than that, .wrap scrolls sideways. */
    th:first-child, td.seq {
      /* width on a table cell cannot beat min-content, so shrink the content. */
      font-size: 12px; padding-left: 2px; padding-right: 2px;
    }
    th:nth-child(2), td.name {
      max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    td.name input { max-width: 100%; }
    .rp, .pl-full { display: none; }
    .pl-short { display: inline; }
    td input { text-align: center; padding: 2px 0; }
    /* Keep the whole table inside a 360px screen: no sideways scroll. */
    td.del { padding: 0; }
    td.del button { width: 30px; min-height: 32px; font-size: 16px; }
  }
</style>
</head>
<body>
<main>
  <h1>Quiz Scoreboard</h1>

  <form id="add-form">
    <input id="team-name" placeholder="Team name" autocomplete="off" maxlength="40">
    <button type="submit">Add team</button>
  </form>

  <div class="wrap">
    <table id="board">
      <thead>
        <tr>
          <th class="seq-h" data-sort="seq" title="Order teams were added">#</th>
          <th data-sort="name" title="Sort by name">Team</th>
          <th data-sort="r0"><span class="rp">R</span>1</th>
          <th data-sort="r1"><span class="rp">R</span>2</th>
          <th data-sort="r2"><span class="rp">R</span>3</th>
          <th data-sort="r3"><span class="rp">R</span>4</th>
          <th data-sort="r4"><span class="rp">R</span>5</th>
          <th data-sort="total"><span class="pl-full">Total</span><span class="pl-short">Tot</span></th>
          <th data-sort="place" title="Sort by place"><span class="pl-full">Place</span><span class="pl-short">Pl</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p id="hint">Tap a round cell to enter points (0&ndash;10, halves allowed) &mdash; Enter moves to the next one. Tap a team name to rename it, or a column header to sort.</p>
</main>

<script>
(function () {
  var KEY = 'quiz-scoreboard';
  var ROUNDS = 5;

  var teams = load();
  var sort = { key: 'place', dir: 1 };
  var editing = null;      // { id: teamId, field: 'name' | roundIndex }
  var activeInput = null;

  var tbody = document.querySelector('#board tbody');

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return [];
      return JSON.parse(raw).map(function (t, i) {
        var scores = Array.isArray(t.scores) ? t.scores.slice(0, ROUNDS) : [];
        while (scores.length < ROUNDS) scores.push(null);
        // Boards saved before the # column existed get numbered by stored order.
        return { id: t.id, seq: isFinite(t.seq) ? t.seq : i + 1, name: String(t.name), scores: scores };
      });
    } catch (e) {
      return [];
    }
  }

  // Never reused, so a team keeps its number when an earlier team is removed.
  function nextSeq() {
    return teams.reduce(function (m, t) { return Math.max(m, t.seq); }, 0) + 1;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(teams)); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Totals, places (ties share a place), then the chosen sort order.
  function rows() {
    var list = teams.map(function (t) {
      var total = t.scores.reduce(function (a, v) { return a + (v || 0); }, 0);
      return { id: t.id, seq: t.seq, name: t.name, scores: t.scores, total: total, place: 0 };
    });

    var byTotal = list.slice().sort(function (a, b) { return b.total - a.total; });
    byTotal.forEach(function (t, i) {
      t.place = (i > 0 && byTotal[i - 1].total === t.total) ? byTotal[i - 1].place : i + 1;
    });

    var key = sort.key;
    list.sort(function (a, b) {
      var v;
      if (key === 'seq') v = a.seq - b.seq;
      else if (key === 'name') v = a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      else if (key === 'place') v = a.place - b.place;
      else if (key === 'total') v = a.total - b.total;
      else {
        var i = +key.slice(1);
        v = (a.scores[i] == null ? -1 : a.scores[i]) - (b.scores[i] == null ? -1 : b.scores[i]);
      }
      return (v * sort.dir) || (a.place - b.place) || a.name.localeCompare(b.name);
    });
    return list;
  }

  function render() {
    if (activeInput) { activeInput.onblur = null; activeInput = null; }

    var list = rows();

    tbody.innerHTML = list.map(function (t) {
      var cells = t.scores.map(function (s, i) {
        if (editing && editing.id === t.id && editing.field === i) {
          return '<td class="score"><input type="number" min="0" max="10" step="0.5" ' +
                 'inputmode="decimal" enterkeyhint="next" value="' + (s == null ? '' : s) + '"></td>';
        }
        return '<td class="score' + (s == null ? ' empty-score' : '') + '" tabindex="0" ' +
               'data-field="' + i + '">' + (s == null ? '&ndash;' : s) + '</td>';
      }).join('');

      var name = (editing && editing.id === t.id && editing.field === 'name')
        ? '<td class="name"><input type="text" maxlength="40" enterkeyhint="done" value="' + esc(t.name) + '"></td>'
        : '<td class="name" tabindex="0" data-field="name" title="' + esc(t.name) + '">' + esc(t.name) + '</td>';

      return '<tr data-id="' + t.id + '"' + (t.place === 1 ? ' class="first"' : '') + '>' +
        '<td class="seq">' + t.seq + '</td>' +
        name + cells +
        '<td class="total">' + t.total + '</td>' +
        '<td class="place">' + t.place + '</td>' +
        '<td class="del"><button type="button" title="Remove team" aria-label="Remove ' + esc(t.name) + '">&times;</button></td>' +
      '</tr>';
    }).join('');

    if (!teams.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:left;color:var(--muted)">' +
                        'No teams yet &mdash; add one above.</td></tr>';
    }

    document.querySelectorAll('th[data-sort]').forEach(function (th) {
      if (th.dataset.sort === sort.key) {
        th.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending');
      } else {
        th.removeAttribute('aria-sort');
      }
    });

    var input = tbody.querySelector('input');
    if (input) {
      activeInput = input;
      input.focus();
      input.select();
      input.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      input.onblur = function () { commit(input.value); };
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(input.value, 1); }
        else if (e.key === 'Escape') { e.preventDefault(); editing = null; render(); }
        else if (e.key === 'Tab') { e.preventDefault(); commit(input.value, e.shiftKey ? -1 : 1); }
      };
    }
  }

  // Write an editor's value back to the model, without re-rendering.
  function applyEdit(target, value) {
    var team = teams.filter(function (t) { return t.id === target.id; })[0];
    if (!team) return;

    if (target.field === 'name') {
      var name = value.trim();
      if (name) team.name = name;
    } else {
      var raw = value.trim();
      var n = Number(raw);
      team.scores[target.field] = (raw === '' || !isFinite(n))
        ? null
        : Math.max(0, Math.min(10, Math.round(n * 2) / 2));  // nearest half point
    }
    save();
  }

  // Save whatever editor is open, so switching away never drops a keystroke.
  function flushOpenEditor() {
    if (editing && activeInput) applyEdit(editing, activeInput.value);
  }

  function commit(value, step) {
    if (!editing) return;
    var target = editing;
    applyEdit(target, value);
    editing = step ? nextCell(target, step) : null;
    render();
  }

  // Moving straight from one editor to another, in a single click.
  function openEditor(id, field) {
    if (editing && editing.id === id && editing.field === field) return;
    flushOpenEditor();
    editing = { id: id, field: field };
    render();
  }

  // Walks round cells in the order currently shown on screen.
  function nextCell(from, step) {
    var order = rows();
    var row = order.findIndex(function (t) { return t.id === from.id; });
    if (row < 0) return null;

    var col = from.field === 'name' ? (step > 0 ? -1 : 0) : from.field;
    var next = col + step;

    if (next >= ROUNDS) { row += 1; next = 0; }
    else if (next < 0) { row -= 1; next = ROUNDS - 1; }
    if (row < 0 || row >= order.length) return null;

    return { id: order[row].id, field: next };
  }

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    flushOpenEditor();
    var field = document.getElementById('team-name');
    var name = field.value.trim();
    if (!name) return;
    teams.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      seq: nextSeq(), name: name, scores: new Array(ROUNDS).fill(null)
    });
    field.value = '';
    field.focus();
    save();
    render();
  });

  tbody.addEventListener('mousedown', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var cell = e.target.closest('td[data-field]');
    if (!cell && !e.target.closest('td.del')) return;

    // Stop the press from moving focus. Otherwise the open editor blurs, the
    // table re-renders, and the element being pressed is gone before mouseup -
    // so no click is ever dispatched and the press appears to do nothing.
    e.preventDefault();

    if (cell) {
      var field = cell.dataset.field;
      openEditor(row.dataset.id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('click', function (e) {
    var row = e.target.closest('tr[data-id]');
    if (!row) return;
    var id = row.dataset.id;

    if (e.target.closest('td.del')) {
      flushOpenEditor();
      var team = teams.filter(function (t) { return t.id === id; })[0];
      if (team && confirm('Remove "' + team.name + '"?')) {
        teams = teams.filter(function (t) { return t.id !== id; });
        editing = null;
        save();
        render();
      }
      return;
    }

    var cell = e.target.closest('td[data-field]');
    if (cell) {
      var field = cell.dataset.field;
      openEditor(id, field === 'name' ? 'name' : +field);
    }
  });

  tbody.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var cell = e.target.closest('td[data-field]');
    if (!cell) return;
    e.preventDefault();
    var field = cell.dataset.field;
    openEditor(cell.closest('tr').dataset.id, field === 'name' ? 'name' : +field);
  });

  document.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      flushOpenEditor();
      var key = th.dataset.sort;
      if (sort.key === key) sort.dir *= -1;
      else sort = { key: key, dir: (key === 'place' || key === 'name' || key === 'seq') ? 1 : -1 };
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
